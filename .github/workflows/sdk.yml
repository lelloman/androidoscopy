name: SDK CI

on:
  push:
    branches: [master, implementation]
    paths:
      - 'android/**'
      - 'pairing-rate-limit/**'
      - 'simple-server.rev'
      - 'scripts/prepare-android-native.sh'
      - 'scripts/check-pairing-native-artifact.py'
      - '.github/workflows/sdk.yml'
  pull_request:
    branches: [master]
    paths:
      - 'android/**'
      - 'pairing-rate-limit/**'
      - 'simple-server.rev'
      - 'scripts/prepare-android-native.sh'
      - 'scripts/check-pairing-native-artifact.py'
      - '.github/workflows/sdk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: android-actions/setup-android@v3

      - name: Prepare native pairing library
        working-directory: .
        run: ./scripts/prepare-android-native.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :sdk:test

      - name: Build SDK
        run: ./gradlew :sdk:assemble

      - name: Verify SDK AAR native ABIs and page alignment
        run: python3 ../scripts/check-pairing-native-artifact.py sdk/build/outputs/aar/sdk-release.aar

      - name: Build demo APK and verify packaged native ABIs
        run: |
          ./gradlew :app:assembleDebug
          python3 ../scripts/check-pairing-native-artifact.py app/build/outputs/apk/debug/app-debug.apk

  instrumented-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: android-actions/setup-android@v3

      - name: Prepare native pairing library
        working-directory: .
        run: ./scripts/prepare-android-native.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          working-directory: android
          script: ./gradlew :sdk:connectedAndroidTest
