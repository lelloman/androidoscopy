[package]
name = "androidoscopy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Debug server for Android applications with real-time dashboard"
repository = "https://github.com/lelloman/androidoscopy"
keywords = ["android", "debugging", "developer-tools", "websocket"]
categories = ["development-tools", "command-line-utilities"]
readme = "../README.md"

[dependencies]
simple-server = { git = "https://github.com/lelloman/simple-server", rev = "46a36391ccca522f3ec9aa24206f2b231162dd96", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
tower-http = { version = "0.5", features = ["fs"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
dirs = "5"
rcgen = "0.13"
local-ip-address = "0.6"
clap = { version = "4", features = ["derive"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

[dev-dependencies]
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
rustls = "0.23"
