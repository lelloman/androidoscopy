[package]
name = "androidoscopy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Debug server for Android applications with real-time dashboard"
repository = "https://github.com/lelloman/androidoscopy"
keywords = ["android", "debugging", "developer-tools", "websocket"]
categories = ["development-tools", "command-line-utilities"]
readme = "../README.md"

[dependencies]
tracing-log = "0.2"
anyhow = "1"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
mdns-sd = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rmcp = { version = "0.8", features = ["server", "transport-io"] }
tokio-util = { version = "0.7", features = ["rt"] }
simple-server = { path = "../../simple-server", features = ["ws", "lifecycle", "logging"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
tower-http = { version = "0.5", features = ["fs"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
dirs = "5"
rcgen = "0.13"
local-ip-address = "0.6"
clap = { version = "4", features = ["derive"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

[dev-dependencies]
log = "0.4"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
